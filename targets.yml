# uptime — monitoring targets
#
# Every scheduled workflow run checks each target below over HTTPS, records
# the result in state/history.json (committed back to this repo), opens a
# GitHub issue when a target goes down and closes it when it recovers.
#
# Reference: see README.md ("targets.yml reference").

version: 1

defaults:
  timeout_ms: 10000
  max_redirects: 5

targets:
  # A static page: plain status check plus a body assertion, so a 200 that
  # serves an error template still counts as DOWN.
  - id: homepage
    url: https://example.com
    label: Homepage
    contain: "Example Domain"

  # An API health endpoint that may legitimately answer 200 or 204.
  - id: api-health
    url: https://www.githubstatus.com/api/v2/status.json
    label: Status API
    expected_status: [200]
    contain: '"indicator"'
    timeout_ms: 5000
    headers:
      accept: application/json

  # Redirect chains are followed and the hop count is recorded.
  - id: www-redirect
    url: https://www.example.com
    label: WWW (redirects to apex)
    max_redirects: 3
